<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Şampiyonlar Ligi Tahmin Ligi</title>
  <meta name="theme-color" content="#050b2e" />
  <meta name="description" content="Şirket içi Şampiyonlar Ligi tahmin yarışması" />
  <link rel="icon" type="image/png" href="assets/favicon.png?v=18" />
  <link rel="apple-touch-icon" href="assets/favicon.png?v=18" />
  <link rel="stylesheet" href="styles.css?v=18" />
  <script src="config.js?v=18"></script>
</head>
<body>
<script>
(function () {
  // ── Arka planda dönecek sözler ──
  var ayetler = [
    "أَفِقْ وَعُدْ إِلَىٰ رُشْدِكَ",
    "اِنْتَبِهْ وَاحْذَرْ",
    "الطَّرِيقُ الَّذِي تَسِيرُ فِيهِ لَيْسَ طَرِيقًا",
    "كُنْ رَجُلًا",
    "صُمْ وَابْتَعِدْ عَنِ الْحَرَامِ"
  ];

  // ── Font ──
  var f = document.createElement('link');
  f.rel = 'stylesheet';
  f.href = 'https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap';
  document.head.appendChild(f);

  // ── Animasyon ──
  var st = document.createElement('style');
  st.textContent = '@keyframes ayetGecis{0%{opacity:0;transform:translateY(20px)}15%,60%{opacity:.20}75%,100%{opacity:0;transform:translateY(-20px)}}';
  document.head.appendChild(st);

  var tugra = '<svg viewBox="0 0 300 200" style="position:absolute;bottom:6vh;left:50%;transform:translateX(-50%);width:60vmin;opacity:.14;" fill="none" stroke="#ffd700" stroke-width="4" stroke-linecap="round"><path d="M60 170 Q55 60 70 40 M85 170 Q80 55 95 35 M110 170 Q105 55 120 35"/><path d="M60 170 Q160 185 235 150 Q285 128 250 70 Q225 30 185 60 Q160 80 175 115"/><path d="M235 150 Q280 150 270 100 Q262 62 225 78"/><path d="M120 150 Q170 160 205 140"/></svg>';

  var gecildi = false;   // "geç" denince perde bir daha kurulmaz

  function gec() {
    gecildi = true;
    var d = document.getElementById('uyari');
    if (d) { d.style.transition = 'opacity .4s'; d.style.opacity = '0'; setTimeout(function () { d.remove(); }, 400); }
  }

  function goster() {
    if (gecildi || document.getElementById('uyari')) return;
    var d = document.createElement('div');
    d.id = 'uyari';
    d.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:radial-gradient(circle at 50% 40%,#0a1a4a,#02040f);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;overflow:hidden;padding:5vw;box-sizing:border-box;";
    d.innerHTML =
      tugra +
      '<div id="ayetKat" dir="rtl" style="position:absolute;top:12%;left:0;right:0;text-align:center;font-family:\'Amiri\',serif;font-size:8vw;color:#ffd700;z-index:0;padding:0 6vw;"></div>' +
      '<div style="font-size:11vw;font-weight:900;text-align:center;z-index:1;">KUMAR<br>HARAMDIR</div>' +
      '<div style="margin-top:3vh;font-size:3.5vw;opacity:.65;z-index:1;">devam etmek için dokun</div>' +
      '<button id="uyariGec" style="position:absolute;top:16px;right:16px;z-index:2;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;color:rgba(255,255,255,.75);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:99px;">geç →</button>' +
      '<audio id="ezan" src="assets/ezan.mp3" preload="auto" loop></audio>';
    document.body.appendChild(d);

    d.querySelector('#uyariGec').addEventListener('click', function (e) {
      e.stopPropagation();
      gec();
    });

    // İlk dokunuş sesi çalar, ikincisi perdeyi geçer.
    var dokunuldu = false;
    d.addEventListener('click', function () {
      if (!dokunuldu) {
        dokunuldu = true;
        var a = document.getElementById('ezan');
        if (a) a.play().catch(function () {});
        return;
      }
      gec();
    });
  }

  function sonrakiAyet() {
    var k = document.getElementById('ayetKat');
    if (!k || !ayetler.length) return;
    k.style.animation = 'none';
    k.textContent = ayetler[Math.floor(Math.random() * ayetler.length)];
    void k.offsetWidth;
    k.style.animation = 'ayetGecis 6s ease-in-out';
  }

  goster();
  setInterval(goster, 500);        // katman silinirse geri koy
  sonrakiAyet();
  setInterval(sonrakiAyet, 6000);  // her 6 sn'de yeni söz
})();
</script>
  <div class="stars" aria-hidden="true"></div>

  <main id="auth" class="auth hidden">
    <div class="auth-card">
      <img class="auth-logo" src="assets/ucl-logo.png?v=18" alt="UEFA Şampiyonlar Ligi" />
      <h1>Tahmin <span>Ligi</span></h1>
      <p class="auth-sub">Kullanıcı adın ve şifrenle gir, maç başına 1 / X / 2 tahmini yap.</p>

      <div class="seg" role="tablist">
        <button class="seg-btn active" data-mode="login" role="tab">Giriş yap</button>
        <button class="seg-btn" data-mode="register" role="tab">Kayıt ol</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>Kullanıcı adı</span>
          <input id="f-name" type="text" required maxlength="24" placeholder="Buğra" autocomplete="username" />
        </label>
        <label class="field">
          <span>Şifre</span>
          <input id="f-pass" type="password" required minlength="6" placeholder="En az 6 karakter" autocomplete="current-password" />
        </label>
        <button class="btn primary block" id="auth-submit" type="submit">Giriş yap</button>
        <p class="auth-msg" id="auth-msg"></p>
      </form>
    </div>
  </main>

  <!-- ----------------------------------------------- uygulama -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand"><img class="brand-logo" src="assets/ucl-ball.png?v=18" alt="" /> Tahmin Ligi</div>
      <div class="who">
        <span id="me-name"></span>
        <button class="btn ghost sm" id="logout">Çıkış</button>
      </div>
    </header>

    <div id="reminder" class="reminder hidden"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="matches" role="tab">Maçlar</button>
      <button class="tab" data-view="preds" role="tab">Tahminler</button>
      <button class="tab" data-view="table" role="tab">Puan Durumu</button>
    </nav>

    <main class="content">
      <section id="view-matches" class="view">
        <div class="round-bar">
          <button class="btn ghost sm" id="round-prev" aria-label="Önceki tur">‹</button>
          <select id="round-select" aria-label="Tur seç"></select>
          <button class="btn ghost sm" id="round-next" aria-label="Sonraki tur">›</button>
        </div>
        <div id="days"></div>
      </section>

      <section id="view-preds" class="view hidden">
        <div class="filter-bar">
          <label class="filt"><span>Gün</span><select id="f-day"></select></label>
          <label class="filt"><span>Kişi</span><select id="f-user"></select></label>
        </div>
        <div id="pred-list"></div>
      </section>

      <section id="view-table" class="view hidden">
        <div id="standings"></div>
        <h2 class="section-title">Tur şampiyonları</h2>
        <div id="round-winners"></div>
      </section>
    </main>

    <footer class="foot">
      Doğru 1/X/2 → <b>3 puan</b> · Tam skor → <b>+2 bonus</b> · Yanlış skorun cezası yok.<br />
      Her maçın tahmini kendi başlama saatinde kilitlenir.<br />Herkesin tahmini maç bitince görünür.
      <div id="stamp" class="stamp"></div>
    </footer>
  </div>

  <button id="chat-fab" class="chat-fab hidden" aria-label="Sohbeti aç">
    💬<span id="chat-badge" class="badge hidden"></span>
  </button>

  <div id="chat-pop" class="chat-pop hidden" role="dialog" aria-label="Sohbet">
    <div class="pop-head">
      <b>Sohbet</b>
      <button id="chat-close" class="pop-x" aria-label="Kapat">×</button>
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div id="mention-box" class="mention-box hidden"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="500" placeholder="Mesaj yaz…  (@ ile etiketle)" />
      <button class="btn primary" type="submit" aria-label="Gönder">➤</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <div id="boot" class="boot"><div class="spinner"></div></div>

  <script type="module" src="app.js?v=18"></script>
</body>
</html>
