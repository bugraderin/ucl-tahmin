<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Şampiyonlar Ligi Tahmin Ligi</title>
  <meta name="theme-color" content="#050b2e" />
  <meta name="description" content="Şirket içi Şampiyonlar Ligi tahmin yarışması" />
  <link rel="icon" type="image/png" href="assets/favicon.png?v=21" />
  <link rel="apple-touch-icon" href="assets/favicon.png?v=21" />
  <link rel="stylesheet" href="styles.css?v=21" />
  <script src="config.js?v=21"></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main id="auth" class="auth hidden">
    <div class="auth-card">
      <img class="auth-logo" src="assets/ucl-logo.png?v=21" alt="UEFA Şampiyonlar Ligi" />
      <h1>Tahmin <span>Ligi</span></h1>
      <p class="auth-sub">Kullanıcı adın ve şifrenle gir, maç başına 1 / X / 2 tahmini yap.</p>

      <div class="seg" role="tablist">
        <button class="seg-btn active" data-mode="login" role="tab">Giriş yap</button>
        <button class="seg-btn" data-mode="register" role="tab">Kayıt ol</button>
      </div>

      <form id="auth-form" autocomplete="on">
        <label class="field">
          <span>Kullanıcı adı</span>
          <input id="f-name" type="text" required maxlength="24" placeholder="Buğra" autocomplete="username" />
        </label>
        <label class="field">
          <span>Şifre</span>
          <input id="f-pass" type="password" required minlength="6" placeholder="En az 6 karakter" autocomplete="current-password" />
        </label>
        <button class="btn primary block" id="auth-submit" type="submit">Giriş yap</button>
        <p class="auth-msg" id="auth-msg"></p>
      </form>
    </div>
  </main>

  <!-- ----------------------------------------------- uygulama -->
  <div id="app" class="hidden">
    <header class="top">
      <div class="brand"><img class="brand-logo" src="assets/ucl-ball.png?v=21" alt="" /> Tahmin Ligi</div>
      <div class="who">
        <span id="bakiye" class="bakiye"></span>
        <span id="me-name"></span>
        <button class="btn ghost sm" id="logout">Çıkış</button>
      </div>
    </header>

    <div id="reminder" class="reminder hidden"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="matches" role="tab">Maçlar</button>
      <button class="tab" data-view="preds" role="tab">Tahminler</button>
      <button class="tab" data-view="table" role="tab">Puan Durumu</button>
    </nav>

    <main class="content">
      <section id="view-matches" class="view">
        <div class="round-bar">
          <button class="btn ghost sm" id="round-prev" aria-label="Önceki tur">‹</button>
          <select id="round-select" aria-label="Tur seç"></select>
          <button class="btn ghost sm" id="round-next" aria-label="Sonraki tur">›</button>
        </div>
        <div id="days"></div>
      </section>

      <section id="view-preds" class="view hidden">
        <div class="filter-bar">
          <label class="filt"><span>Gün</span><select id="f-day"></select></label>
          <label class="filt"><span>Kişi</span><select id="f-user"></select></label>
        </div>
        <div id="pred-list"></div>
      </section>

      <section id="view-table" class="view hidden">
        <div id="standings"></div>
        <h2 class="section-title">Tur şampiyonları</h2>
        <div id="round-winners"></div>
      </section>
    </main>

    <footer class="foot">
      Doğru 1/X/2 → <b>3 puan</b> · Tam skor → <b>+2 bonus</b> · Yanlış skorun cezası yok.<br />
      Her maçın tahmini kendi başlama saatinde kilitlenir.<br />Herkesin tahmini maç bitince görünür.
      <div id="stamp" class="stamp"></div>
    </footer>
  </div>

  <button id="chat-fab" class="chat-fab hidden" aria-label="Sohbeti aç">
    💬<span id="chat-badge" class="badge hidden"></span>
  </button>

  <div id="chat-pop" class="chat-pop hidden" role="dialog" aria-label="Sohbet">
    <div class="pop-head">
      <b>Sohbet</b>
      <button id="chat-close" class="pop-x" aria-label="Kapat">×</button>
    </div>
    <div id="chat-list" class="chat-list"></div>
    <div id="mention-box" class="mention-box hidden"></div>
    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" type="text" maxlength="500" placeholder="Mesaj yaz…  (@ ile etiketle)" />
      <button class="btn primary" type="submit" aria-label="Gönder">➤</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <div id="boot" class="boot"><div class="spinner"></div></div>

  <script type="module" src="app.js?v=21"></script>
</body>
</html>
