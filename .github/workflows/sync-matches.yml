name: Maçları senkronla

on:
  schedule:
    # GitHub'ın zamanlanmış görevleri :00 ve :30 gibi yoğun dakikalarda
    # sık sık gecikiyor ya da atlanıyor; bilerek sapa dakikalar seçildi.
    - cron: '7,22,37,52 * * * *'
  # Elle, ve veri bayatlayınca Supabase bekçisi tarafından (bkz. supabase/watchdog.sql)
  workflow_dispatch:

concurrency:
  group: sync-matches
  cancel-in-progress: true   # yeni çalıştırma, takipteki eskisini devralır

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fikstürü çek ve Supabase'e yaz
        env:
          FOOTBALL_DATA_TOKEN:       ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Maç varsa çalıştırma, maçlar bitene kadar 3 dakikada bir tazeler.
          WATCH: '1'
          WATCH_INTERVAL_SEC: '180'
          WATCH_MINUTES: '50'
        run: node scripts/sync-matches.mjs
