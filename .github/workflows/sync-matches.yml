name: Maçları senkronla

on:
  schedule:
    - cron: '*/30 * * * *'   # yarım saatte bir (fikstür + canlı sonuçlar)
  workflow_dispatch:          # elle de tetiklenebilir

concurrency:
  group: sync-matches
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fikstürü çek ve Supabase'e yaz
        env:
          FOOTBALL_DATA_TOKEN:       ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-matches.mjs
